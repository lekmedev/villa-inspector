<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7CA0F8">
<title>Bảo trì villa</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: linear-gradient(180deg, #7CA0F8 0%, #A17EEF 50%, #E57AB6 100%);
  min-height: 100vh;
}
.tap { transition: transform 0.15s, opacity 0.15s; }
.tap:active { transform: scale(0.96); opacity: 0.8; }
.sheet { transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
.fade { transition: opacity 0.3s; }
.pill { transition: transform 0.45s cubic-bezier(0.3, 1.3, 0.5, 1), opacity 0.3s; }
input[type=search]::-webkit-search-cancel-button { display: none; }
</style>
</head>
<body class="p-3 sm:p-6 flex flex-col items-center justify-start pb-20 select-none">

<!-- Toast Notification -->
<div id="toast" class="pill fixed top-5 left-1/2 z-[60] -translate-x-1/2 -translate-y-24 opacity-0 bg-slate-900/90 backdrop-blur-md text-white text-xs font-semibold rounded-full px-5 py-2.5 shadow-2xl flex items-center gap-2">
  <span id="toastIcon">✨</span>
  <span id="toastText"></span>
</div>

<!-- Main Card Container (Phong cách Contact List Card trong ảnh) -->
<div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-white/40 flex flex-col">
  
  <!-- Header Bar -->
  <div class="p-4 border-b border-slate-100 flex items-center justify-between">
    <button id="btnSync" title="Đồng bộ Google Sheet" class="tap w-10 h-10 rounded-full bg-slate-50 hover:bg-slate-100 text-slate-700 flex items-center justify-center">
      <svg id="syncIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
    </button>
    
    <div class="text-center">
      <h1 class="text-lg font-bold text-slate-900 tracking-tight">Bảo trì villa</h1>
      <p class="text-[11px] text-slate-400 font-medium">Chụp hình dạo · <span id="doneNum">0</span>/79 xong</p>
    </div>

    <button id="btnSettings" title="Cài đặt" class="tap w-10 h-10 rounded-full bg-slate-50 hover:bg-slate-100 text-slate-700 flex items-center justify-center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Tabs: "Nay làm..." vs "Tất cả" & Progress -->
  <div class="p-3 bg-slate-50/70 border-b border-slate-100 space-y-2.5">
    <div class="flex items-center gap-2">
      <div class="flex-1 bg-slate-200/70 p-1 rounded-2xl flex text-xs font-semibold">
        <button id="tab-fav" onclick="setTab('fav')" class="flex-1 py-1.5 rounded-xl bg-white text-slate-900 shadow-sm transition-all flex items-center justify-center gap-1">
          <span>⭐ Nay làm</span>
          <span id="favCount" class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.2 rounded-full font-bold">0</span>
        </button>
        <button id="tab-all" onclick="setTab('all')" class="flex-1 py-1.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all flex items-center justify-center gap-1">
          <span>Tất cả</span>
          <span class="text-[10px] text-slate-400 font-normal">79</span>
        </button>
      </div>
    </div>

    <!-- Search Input Inside Card -->
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" inputmode="numeric" placeholder="Tìm số villa (VD: 01, 35, 79)..." autocomplete="off" class="w-full h-9 pl-9 pr-8 rounded-xl bg-white border border-slate-200 text-xs font-medium outline-none focus:border-indigo-400 transition-colors">
      <button id="clear" aria-label="Xoá" class="tap hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-slate-300 text-white text-[10px] items-center justify-center">✕</button>
    </div>
  </div>

  <!-- Contact-Style Villa List -->
  <div id="pendingList" class="divide-y divide-slate-100 max-h-[62vh] overflow-y-auto"></div>
  <p id="empty" class="hidden text-center text-xs text-slate-400 py-12">Không có villa nào khớp.</p>

  <!-- Collapsible Completed Section -->
  <div id="completedSection" class="border-t border-slate-100 bg-slate-50/50 hidden">
    <button id="toggleCompleted" class="tap w-full flex items-center justify-between p-3.5 text-left text-xs font-bold text-slate-700">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>Đã hoàn thành</span>
        <span id="completedBadge" class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">0</span>
      </div>
      <svg id="collapseIcon" class="w-4 h-4 text-slate-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>
    <div id="completedList" class="divide-y divide-slate-100 hidden bg-white"></div>
  </div>

</div>

<!-- Camera Hidden Input -->
<input id="cam" type="file" accept="image/*" capture="environment" class="hidden">

<!-- Scrim & Sheets -->
<div id="scrim" class="fade fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none"></div>

<!-- Photo Preview Sheet -->
<div id="photoSheet" class="sheet fixed inset-x-0 bottom-0 z-[55] translate-y-full rounded-t-3xl bg-white max-w-md mx-auto p-4 space-y-3 shadow-2xl">
  <div class="w-10 h-1 rounded-full bg-slate-200 mx-auto mb-2"></div>
  <div class="flex justify-between items-center">
    <div>
      <h3 id="shTitle" class="font-bold text-base text-slate-900">Villa 01</h3>
      <p id="shSub" class="text-xs text-slate-500">Ảnh trước dọn</p>
    </div>
    <button data-close class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 flex items-center justify-center font-bold">&times;</button>
  </div>
  <div class="rounded-2xl overflow-hidden bg-slate-950 flex items-center justify-center p-2">
    <img id="shImg" alt="Ảnh villa" class="max-h-[50vh] w-auto object-contain rounded-xl">
  </div>
  <div class="space-y-2 pt-1">
    <button id="shRetake" class="tap w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/30">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Chụp lại ảnh này
    </button>
    <button data-close class="tap w-full py-2.5 bg-slate-100 text-slate-700 font-semibold rounded-2xl text-xs">Đóng</button>
  </div>
</div>

<!-- Settings Sheet -->
<div id="setSheet" class="sheet fixed inset-x-0 bottom-0 z-[55] translate-y-full rounded-t-3xl bg-white max-w-md mx-auto p-5 space-y-4 shadow-2xl">
  <div class="w-10 h-1 rounded-full bg-slate-200 mx-auto mb-2"></div>
  <div>
    <h3 class="font-bold text-base text-slate-900">Kết nối Google Apps Script</h3>
    <p class="text-xs text-slate-500 mt-0.5">Dán URL Web App (doGet / doPost) để đồng bộ dữ liệu chung.</p>
  </div>
  <input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 border border-slate-200 text-xs font-mono outline-none focus:border-indigo-500">
  <div class="grid grid-cols-2 gap-2 pt-2">
    <button data-close class="tap py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-xs">Đóng</button>
    <button id="gasSave" class="tap py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-xs shadow-md shadow-indigo-500/20">Lưu & Đồng bộ</button>
  </div>
</div>

<script>
// CẤU HÌNH MẶC ĐỊNH
const DEFAULT_GAS_URL = ""; 

const TOTAL = 80;
const VILLAS_LIST = Array.from({length: TOTAL}, (_, i) => i + 1).filter(n => n !== 13);
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
};

function getGasEndpoint() {
  return store.get('vi:gas', '') || DEFAULT_GAS_URL;
}

let favs = new Set(store.get('vi:favs', []));
let photos = store.get('vi:photos', {});
let tab = 'fav';
let q = '', target = null;
let isCompletedExpanded = false;

const done = n => !!(photos[n] && photos[n].before && photos[n].after);

function renderContactRow(n) {
  const p = photos[n] || {};
  const isDone = done(n);
  const isFav = favs.has(n);
  const hasPartial = !isDone && (p.before || p.after);

  // Status Indicator Dot (Xanh lá: xong | Vàng: đang làm | Xám: chưa)
  const statusColor = isDone ? 'bg-emerald-500' : hasPartial ? 'bg-amber-400' : 'bg-slate-300';
  const statusText = isDone ? 'Hoàn thành' : hasPartial ? 'Đang thực hiện' : 'Chưa kiểm tra';

  // Nút Trước
  const beforeBtn = p.before 
    ? `<button data-view="${n}:before" class="tap flex items-center gap-1.5 p-1 pr-2 rounded-xl bg-emerald-50 border border-emerald-200">
        <img src="${p.before}" class="w-7 h-7 object-cover rounded-lg shadow-xs" />
        <span class="text-[11px] font-bold text-emerald-800">Trước ✓</span>
       </button>`
    : `<button data-snap="${n}:before" class="tap px-2.5 py-1.5 rounded-xl border border-slate-200 hover:border-amber-400 bg-slate-50 text-slate-700 text-xs font-semibold flex items-center gap-1">
        <svg class="w-3.5 h-3.5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Trước</span>
       </button>`;

  // Nút Sau
  const afterBtn = p.after 
    ? `<button data-view="${n}:after" class="tap flex items-center gap-1.5 p-1 pr-2 rounded-xl bg-emerald-50 border border-emerald-200">
        <img src="${p.after}" class="w-7 h-7 object-cover rounded-lg shadow-xs" />
        <span class="text-[11px] font-bold text-emerald-800">Sau ✓</span>
       </button>`
    : `<button data-snap="${n}:after" class="tap px-2.5 py-1.5 rounded-xl border border-slate-200 hover:border-indigo-400 bg-slate-50 text-slate-700 text-xs font-semibold flex items-center gap-1">
        <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Sau</span>
       </button>`;

  const row = document.createElement('div');
  row.className = `p-3.5 flex items-center justify-between gap-3 hover:bg-slate-50/80 transition-colors ${isFav ? 'bg-amber-50/30' : ''}`;
  row.innerHTML = `
    <div class="flex items-center gap-3">
      <!-- Avatar with Status Dot -->
      <div class="relative flex-shrink-0">
        <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 text-white font-bold flex items-center justify-center text-sm shadow-md border-2 border-white">
          ${pad(n)}
        </div>
        <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-white ${statusColor}"></span>
      </div>

      <!-- Villa Title & Status -->
      <div>
        <div class="flex items-center gap-1.5">
          <button data-star="${n}" class="tap text-slate-300 hover:text-amber-400 p-0.5">
            <span class="text-sm leading-none">${isFav ? '⭐' : '☆'}</span>
          </button>
          <span class="font-bold text-slate-900 text-sm tracking-tight">Villa ${pad(n)}</span>
        </div>
        <p class="text-[11px] text-slate-400 font-medium">${statusText}</p>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-1.5 flex-shrink-0">
      ${beforeBtn}
      ${afterBtn}
    </div>
  `;
  return row;
}

function render() {
  const pendingList = $('#pendingList');
  const completedList = $('#completedList');
  const completedSection = $('#completedSection');

  pendingList.innerHTML = '';
  completedList.innerHTML = '';

  let shownPending = 0;
  let shownCompleted = 0;

  for (const n of VILLAS_LIST) {
    if (tab === 'fav' && !favs.has(n)) continue;
    if (q && !pad(n).includes(q) && !String(n).includes(q)) continue;

    const el = renderContactRow(n);
    if (done(n)) {
      completedList.appendChild(el);
      shownCompleted++;
    } else {
      pendingList.appendChild(el);
      shownPending++;
    }
  }

  if (shownCompleted > 0) {
    completedSection.classList.remove('hidden');
    $('#completedBadge').textContent = shownCompleted;
  } else {
    completedSection.classList.add('hidden');
  }

  let emptyMsg = 'Không có villa nào khớp.';
  if (tab === 'fav' && favs.size === 0 && !q) {
    emptyMsg = 'Chưa chọn căn nào vào mục ⭐ Nay làm. Bấm sao ☆ ở tab Tất cả để thêm.';
  }
  $('#empty').textContent = emptyMsg;
  $('#empty').classList.toggle('hidden', (shownPending + shownCompleted) > 0);

  const d = VILLAS_LIST.filter(done).length;
  $('#doneNum').textContent = d;
  $('#favCount').textContent = favs.size;
}

$('#toggleCompleted').onclick = () => {
  isCompletedExpanded = !isCompletedExpanded;
  $('#completedList').classList.toggle('hidden', !isCompletedExpanded);
  $('#collapseIcon').style.transform = isCompletedExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
};

function setTab(t) {
  tab = t;
  const tabFav = $('#tab-fav');
  const tabAll = $('#tab-all');
  if (t === 'fav') {
    tabFav.className = 'flex-1 py-1.5 rounded-xl bg-white text-slate-900 shadow-sm transition-all flex items-center justify-center gap-1';
    tabAll.className = 'flex-1 py-1.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all flex items-center justify-center gap-1';
  } else {
    tabAll.className = 'flex-1 py-1.5 rounded-xl bg-white text-slate-900 shadow-sm transition-all flex items-center justify-center gap-1';
    tabFav.className = 'flex-1 py-1.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all flex items-center justify-center gap-1';
  }
  render();
}

let tt;
function toast(msg, icon = '✨') {
  $('#toastText').textContent = msg;
  $('#toastIcon').textContent = icon;
  const t = $('#toast');
  t.classList.remove('-translate-y-24', 'opacity-0');
  clearTimeout(tt);
  tt = setTimeout(() => t.classList.add('-translate-y-24', 'opacity-0'), 2500);
}

const openSheet = id => { $('#scrim').classList.remove('opacity-0', 'pointer-events-none'); $(id).classList.remove('translate-y-full'); };
function closeSheets() { $('#scrim').classList.add('opacity-0', 'pointer-events-none'); document.querySelectorAll('.sheet').forEach(s => s.classList.add('translate-y-full')); }
$('#scrim').onclick = closeSheets;
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);

$('#search').oninput = e => { q = e.target.value.trim(); $('#clear').classList.toggle('hidden', !q); $('#clear').classList.toggle('flex', !!q); render(); };
$('#clear').onclick = () => { $('#search').value = ''; q = ''; $('#clear').classList.add('hidden'); render(); };

function handleListClick(e) {
  const s = e.target.closest('[data-star]'), sn = e.target.closest('[data-snap]'), v = e.target.closest('[data-view]');
  if (s) {
    const n = +s.dataset.star;
    favs.has(n) ? favs.delete(n) : favs.add(n);
    store.set('vi:favs', [...favs]);
    toast(favs.has(n) ? `Đã thêm Villa ${pad(n)} vào Nay làm...` : `Đã bỏ Villa ${pad(n)}`, '⭐');
    render();
  } else if (sn) {
    const [n, k] = sn.dataset.snap.split(':');
    target = { n: +n, k };
    $('#cam').click();
  } else if (v) {
    const [n, k] = v.dataset.view.split(':');
    target = { n: +n, k };
    $('#shTitle').textContent = 'Villa ' + pad(n);
    $('#shSub').textContent = k === 'before' ? 'Ảnh trước dọn' : 'Ảnh sau dọn';
    $('#shImg').src = photos[n][k];
    openSheet('#photoSheet');
  }
}

$('#pendingList').onclick = handleListClick;
$('#completedList').onclick = handleListClick;
$('#shRetake').onclick = () => { closeSheets(); setTimeout(() => $('#cam').click(), 250); };

function compressImage(file, maxWidth = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

$('#cam').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !target) return;
  const { n, k } = target;

  toast(`Đang nén và gửi ảnh Villa ${pad(n)}...`, '📸');
  try {
    const b64 = await compressImage(f, 1280, 0.7);
    photos[n] = photos[n] || {};
    photos[n][k] = b64;
    store.set('vi:photos', photos);
    render();

    const gas = getGasEndpoint();
    if (gas) {
      const res = await fetch(gas, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          villaId: `Villa ${pad(n)}`,
          type: k,
          image: b64,
          mimeType: 'image/jpeg'
        })
      });
      const result = await res.json();
      if (result.status === 'success') {
        toast(`Villa ${pad(n)}: đã lưu và tải lên Drive ✓`, '☁️');
        if (result.fileUrl) {
          photos[n][k] = result.fileUrl;
          store.set('vi:photos', photos);
          render();
        }
      } else {
        toast(`Lỗi Drive: ${result.message || 'Thất bại'}`, '⚠️');
      }
    } else {
      toast(`Villa ${pad(n)}: đã lưu trên máy (chưa nối Google)`, '💾');
    }
  } catch (err) {
    console.error(err);
    toast(`Villa ${pad(n)}: đã lưu ảnh cục bộ`, '💾');
  }
};

async function syncFromGoogleSheet(silent = false) {
  const gas = getGasEndpoint();
  if (!gas) {
    if (!silent) toast('Chưa cấu hình link Google Apps Script', '⚠️');
    return;
  }

  const syncIcon = $('#syncIcon');
  if (syncIcon) syncIcon.classList.add('animate-spin');

  try {
    const res = await fetch(gas);
    const result = await res.json();
    if (result.status === 'success' && result.villas) {
      let count = 0;
      for (const [numStr, data] of Object.entries(result.villas)) {
        const n = parseInt(numStr, 10);
        if (!n) continue;
        photos[n] = photos[n] || {};
        if (data.before) photos[n].before = data.before;
        if (data.after) photos[n].after = data.after;
        if (data.before || data.after) count++;
      }
      store.set('vi:photos', photos);
      render();
      if (!silent) toast(`Đã đồng bộ ${count} căn từ Google Sheets ✓`, '🔄');
    }
  } catch (err) {
    console.error(err);
    if (!silent) toast('Không thể đồng bộ dữ liệu từ Sheets', '⚠️');
  } finally {
    if (syncIcon) syncIcon.classList.remove('animate-spin');
  }
}

$('#btnSync').onclick = () => syncFromGoogleSheet(false);
$('#btnSettings').onclick = () => { $('#gasUrl').value = store.get('vi:gas', ''); openSheet('#setSheet'); };
$('#gasSave').onclick = () => {
  store.set('vi:gas', $('#gasUrl').value.trim());
  closeSheets();
  toast('Đã lưu cài đặt!', '✓');
  syncFromGoogleSheet(false);
};

setTab('fav');
render();
syncFromGoogleSheet(true);
</script>
</body>
</html>
