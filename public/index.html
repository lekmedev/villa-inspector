<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Villa Inspector</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body{background:#f5f5f5;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#2b2b2b;-webkit-tap-highlight-color:transparent}
.sub{color:#777}
.soft{background:#f4f4f4}
.tap{transition:transform .15s,background .15s}.tap:active{transform:scale(.96)}
.row:active{background:#fafafa}
.sheet{transition:transform .35s cubic-bezier(.32,.72,0,1)}
.fade{transition:opacity .3s}
.pill{transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .3s}
.seg-t{transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
input[type=search]::-webkit-search-cancel-button{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="toast" class="pill fixed left-1/2 z-[60] -translate-x-1/2 -translate-y-24 opacity-0 bg-black text-white text-[14px] font-medium rounded-full px-5 py-2.5" style="top:calc(env(safe-area-inset-top,0px) + 10px)"><span id="toastText"></span></div>

<div class="relative max-w-md mx-auto min-h-full bg-white sm:my-6 sm:rounded-2xl sm:min-h-[calc(100%-3rem)] sm:shadow-[0_10px_40px_rgba(0,0,0,.08)]">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white sm:rounded-t-2xl" style="padding-top:env(safe-area-inset-top,0px);box-shadow:0 6px 14px -8px rgba(0,0,0,.12)">
    <div class="h-16 px-5 grid grid-cols-[40px_1fr_40px] items-center">
      <button id="btnMenu" aria-label="Cài đặt" class="tap w-10 h-10 -ml-2 flex items-center justify-center text-[#aaa]">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M7 12h13M10 17h10"/></svg>
      </button>
      <div class="text-center leading-tight">
        <div class="text-[20px] font-medium text-[#555]">Villa Inspector</div>
        <div class="text-[12px] sub"><span id="doneNum">0</span> / <span id="totalNum">80</span> hoàn thành</div>
      </div>
      <button id="btnSearch" aria-label="Tìm kiếm" class="tap w-10 h-10 -mr-2 flex items-center justify-center text-[#aaa] justify-self-end">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>
    <div id="searchWrap" class="overflow-hidden transition-all duration-300" style="max-height:0">
      <div class="px-5 pb-3 relative">
        <input id="search" type="search" inputmode="numeric" placeholder="Tìm số villa" autocomplete="off" class="w-full h-10 px-4 pr-10 rounded-full soft text-[16px] outline-none placeholder:text-[#aaa]">
        <button id="clear" aria-label="Xoá" class="tap hidden absolute right-8 top-[calc(50%-6px)] -translate-y-1/2 w-[18px] h-[18px] rounded-full bg-[#bbb] text-white text-[11px] leading-none items-center justify-center">✕</button>
      </div>
    </div>
  </header>

  <!-- Segmented -->
  <div class="px-5 pt-4">
    <div class="relative flex p-[2px] rounded-full soft">
      <div id="segThumb" class="seg-t absolute top-[2px] bottom-[2px] left-[2px] w-[calc(50%-2px)] rounded-full bg-white" style="box-shadow:0 1px 4px rgba(0,0,0,.1)"></div>
      <button data-tab="all" class="seg relative z-10 flex-1 py-1.5 text-[14px] font-medium">Tất cả</button>
      <button data-tab="fav" class="seg relative z-10 flex-1 py-1.5 text-[14px] font-medium">Điểm danh <span id="favCount" class="sub">0</span></button>
    </div>
  </div>

  <!-- List -->
  <div id="list" class="px-2 pt-2 pb-32"></div>
  <p id="empty" class="hidden text-center text-[15px] sub py-20">Không có villa nào khớp.</p>

  <!-- FAB -->
  <div class="sticky bottom-0 z-30 h-0 pointer-events-none">
    <button id="fab" aria-label="Chụp villa tiếp theo" class="tap pointer-events-auto absolute right-5 w-16 h-16 rounded-full bg-white flex items-center justify-center text-[#777]" style="bottom:calc(env(safe-area-inset-bottom,0px) + 24px);box-shadow:0 6px 20px rgba(0,0,0,.14)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
  </div>
</div>

<input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
<div id="scrim" class="fade fixed inset-0 z-50 bg-black/30 opacity-0 pointer-events-none"></div>

<!-- Villa sheet -->
<div id="villaSheet" class="sheet fixed inset-x-0 bottom-0 z-[55] translate-y-full rounded-t-3xl bg-white max-w-md mx-auto" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -8px 40px rgba(0,0,0,.12)">
  <div class="w-9 h-1 rounded-full bg-black/15 mx-auto mt-2.5 mb-4"></div>
  <div class="px-6 flex items-center justify-between">
    <div><div id="vsTitle" class="text-[22px] font-medium">Villa 01</div><div id="vsSub" class="text-[13px] sub">Chưa có ảnh</div></div>
    <button id="vsStar" aria-label="Điểm danh" class="tap p-2 -mr-2"></button>
  </div>
  <div class="px-6 mt-4 grid grid-cols-2 gap-3">
    <button data-slot="before" class="slot tap aspect-[4/5] rounded-2xl soft overflow-hidden relative flex flex-col items-center justify-center text-[#999]"></button>
    <button data-slot="after" class="slot tap aspect-[4/5] rounded-2xl soft overflow-hidden relative flex flex-col items-center justify-center text-[#999]"></button>
  </div>
  <div class="px-6 mt-4"><button data-close class="tap w-full h-12 rounded-full soft text-[16px] font-medium">Xong</button></div>
</div>

<!-- Settings sheet -->
<div id="setSheet" class="sheet fixed inset-x-0 bottom-0 z-[55] translate-y-full rounded-t-3xl bg-white max-w-md mx-auto" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -8px 40px rgba(0,0,0,.12)">
  <div class="w-9 h-1 rounded-full bg-black/15 mx-auto mt-2.5 mb-4"></div>
  <div class="px-6 pb-3"><div class="text-[22px] font-medium">Kết nối Google Sheets</div>
  <div class="text-[13px] sub mt-0.5">Dán địa chỉ Web App (doPost) của Apps Script để gửi ảnh lên.</div></div>
  <div class="px-6"><input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" class="w-full h-11 px-4 rounded-full soft text-[15px] outline-none"></div>
  <div class="px-6 mt-4 grid grid-cols-2 gap-2">
    <button data-close class="tap h-12 rounded-full soft text-[16px] font-medium">Đóng</button>
    <button id="gasSave" class="tap h-12 rounded-full bg-[#2b2b2b] text-white text-[16px] font-medium">Lưu</button>
  </div>
</div>

<script>
const TOTAL = 80;
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
};
let favs = new Set(store.get('vi:favs', []));
let photos = store.get('vi:photos', {});
let tab = 'all', q = '', cur = null, slot = null;
const done = n => !!(photos[n] && photos[n].before && photos[n].after);
const started = n => !!(photos[n] && (photos[n].before || photos[n].after));
const sub = n => done(n) ? 'Đã chụp đủ ảnh trước và sau'
  : started(n) ? (photos[n].before ? 'Có ảnh trước, thiếu ảnh sau' : 'Có ảnh sau, thiếu ảnh trước')
  : 'Chưa kiểm tra';
const dot = n => done(n) ? '#34c759' : started(n) ? '#ffb800' : 'transparent';
const star = on => `<svg width="22" height="22" viewBox="0 0 24 24" fill="${on ? '#2b2b2b' : 'none'}" stroke="#2b2b2b" stroke-width="1.6" stroke-linejoin="round" style="opacity:${on ? 1 : .25}"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;

function render(){
  const list = $('#list'); list.innerHTML = ''; let shown = 0;
  for (let n = 1; n <= TOTAL; n++){
    if (tab === 'fav' && !favs.has(n)) continue;
    if (q && !pad(n).includes(q) && !String(n).includes(q)) continue;
    shown++;
    const el = document.createElement('div');
    el.className = 'row flex items-center gap-4 px-3 h-24 rounded-2xl cursor-pointer';
    el.dataset.open = n;
    const p = photos[n] || {}, img = p.after || p.before;
    el.innerHTML = `
      <div class="relative shrink-0">
        <div class="w-[62px] h-[62px] rounded-full soft overflow-hidden flex items-center justify-center text-[20px] font-medium text-[#999]">${img ? `<img src="${img}" alt="" class="w-full h-full object-cover">` : pad(n)}</div>
        <span class="absolute right-0 bottom-0 w-[14px] h-[14px] rounded-full border-2 border-white" style="background:${dot(n)}"></span>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-[18px] font-medium">Villa ${pad(n)}</div>
        <div class="text-[14px] sub truncate">${sub(n)}</div>
      </div>
      <button data-star="${n}" aria-label="Điểm danh villa ${pad(n)}" class="tap p-2 -mr-1">${star(favs.has(n))}</button>`;
    list.appendChild(el);
  }
  $('#empty').classList.toggle('hidden', shown > 0);
  const d = Array.from({length: TOTAL}, (_, i) => i + 1).filter(done).length;
  $('#doneNum').textContent = d; $('#totalNum').textContent = TOTAL;
  $('#favCount').textContent = favs.size;
}

function renderSheet(){
  const p = photos[cur] || {};
  $('#vsTitle').textContent = 'Villa ' + pad(cur);
  $('#vsSub').textContent = sub(cur);
  $('#vsStar').innerHTML = star(favs.has(cur));
  document.querySelectorAll('.slot').forEach(b => {
    const k = b.dataset.slot, url = p[k], label = k === 'before' ? 'Ảnh trước' : 'Ảnh sau';
    b.innerHTML = url
      ? `<img src="${url}" alt="${label}" class="absolute inset-0 w-full h-full object-cover"><span class="absolute left-2 bottom-2 text-[12px] font-medium bg-white/90 text-[#2b2b2b] rounded-full px-2.5 py-1">${label} · Chụp lại</span>`
      : `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="text-[14px] mt-2">${label}</span>`;
  });
}

let tt;
function toast(msg){
  $('#toastText').textContent = msg;
  const t = $('#toast'); t.classList.remove('-translate-y-24','opacity-0');
  clearTimeout(tt); tt = setTimeout(() => t.classList.add('-translate-y-24','opacity-0'), 2200);
}

const openSheet = id => { $('#scrim').classList.remove('opacity-0','pointer-events-none'); $(id).classList.remove('translate-y-full') };
function closeSheets(){ $('#scrim').classList.add('opacity-0','pointer-events-none'); document.querySelectorAll('.sheet').forEach(s => s.classList.add('translate-y-full')); render() }
function openVilla(n){ cur = n; renderSheet(); openSheet('#villaSheet') }
$('#scrim').onclick = closeSheets;
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);

function setTab(t){
  tab = t;
  $('#segThumb').style.transform = t === 'all' ? 'translateX(0)' : 'translateX(100%)';
  document.querySelectorAll('.seg').forEach(b => b.style.opacity = b.dataset.tab === t ? 1 : .5);
  render();
}
document.querySelectorAll('.seg').forEach(b => b.onclick = () => setTab(b.dataset.tab));

$('#btnSearch').onclick = () => {
  const w = $('#searchWrap'), open = w.style.maxHeight !== '0px' && w.style.maxHeight !== '';
  w.style.maxHeight = open ? '0px' : '64px';
  if (!open) setTimeout(() => $('#search').focus(), 200);
};
$('#search').oninput = e => { q = e.target.value.trim(); $('#clear').classList.toggle('hidden', !q); $('#clear').classList.toggle('flex', !!q); render() };
$('#clear').onclick = () => { $('#search').value = ''; q = ''; $('#clear').classList.add('hidden'); $('#clear').classList.remove('flex'); render(); $('#search').focus() };

function toggleFav(n){ favs.has(n) ? favs.delete(n) : favs.add(n); store.set('vi:favs', [...favs]); toast(favs.has(n) ? `Đã điểm danh Villa ${pad(n)}` : `Đã bỏ điểm danh Villa ${pad(n)}`) }
$('#list').onclick = e => {
  const s = e.target.closest('[data-star]');
  if (s){ e.stopPropagation(); toggleFav(+s.dataset.star); render(); return }
  const r = e.target.closest('[data-open]');
  if (r) openVilla(+r.dataset.open);
};
$('#vsStar').onclick = () => { toggleFav(cur); renderSheet() };
document.querySelectorAll('.slot').forEach(b => b.onclick = () => { slot = b.dataset.slot; $('#cam').click() });

$('#fab').onclick = () => {
  let n = null;
  for (let i = 1; i <= TOTAL; i++){ if (!done(i) && (tab !== 'fav' || favs.has(i))){ n = i; break } }
  n ? openVilla(n) : toast('Đã hoàn thành tất cả');
};

function compressImage(file, maxWidth = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

$('#cam').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !cur || !slot) return;
  const n = cur, k = slot;
  
  toast(`Villa ${pad(n)}: đang lưu ảnh ${k === 'before' ? 'trước' : 'sau'}...`);
  try {
    const b64 = await compressImage(f, 1280, 0.7);
    photos[n] = photos[n] || {};
    photos[n][k] = b64;
    store.set('vi:photos', photos);
    renderSheet();
    render();

    const gas = store.get('vi:gas', '');
    if (gas){
      const res = await fetch(gas, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          villaId: `Villa ${pad(n)}`,
          type: k,
          image: b64,
          mimeType: 'image/jpeg'
        })
      });
      const result = await res.json();
      if (result.status === 'success') {
        toast(`Villa ${pad(n)}: đã lưu lên Drive ✓`);
        if (result.fileUrl) {
          photos[n][k] = result.fileUrl;
          store.set('vi:photos', photos);
          renderSheet();
          render();
        }
      } else {
        toast(`Lỗi Drive: ${result.message || 'Thất bại'}`);
      }
    }
  } catch(err){
    console.error(err);
    toast(`Villa ${pad(n)}: đã lưu ảnh`);
  }
};

$('#btnMenu').onclick = () => { $('#gasUrl').value = store.get('vi:gas', ''); openSheet('#setSheet') };
$('#gasSave').onclick = () => { 
  store.set('vi:gas', $('#gasUrl').value.trim()); 
  closeSheets(); 
  toast('Đã lưu cài đặt');
};

setTab('all');
</script>
</body>
</html>
