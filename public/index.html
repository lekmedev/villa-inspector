<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Chụp hình dạo cùng Culi AN</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
  }
</script>
<style>
html,body{background:#121212;height:100%;color:#e5e5ea}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#e5e5ea;-webkit-tap-highlight-color:transparent}
.sub{color:#8e8e93}
.soft{background:#1c1c1e}
.tap{transition:transform .15s,background .15s}.tap:active{transform:scale(.96)}
.row:active{background:#242426}
.sheet{transition:transform .35s cubic-bezier(.32,.72,0,1)}
.fade{transition:opacity .3s}
.pill{transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .3s}
.seg-t{transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
input[type=search]::-webkit-search-cancel-button{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="bg-[#121212]">

<div id="toast" class="pill fixed left-1/2 z-[60] -translate-x-1/2 -translate-y-24 opacity-0 bg-white text-black text-[14px] font-medium rounded-full px-5 py-2.5 shadow-2xl" style="top:calc(env(safe-area-inset-top,0px) + 10px)"><span id="toastText"></span></div>

<!-- Floating Upload Progress (Chạy ngầm & hiện % tiến trình) -->
<div id="uploadProgressBox" class="fixed right-4 bottom-5 z-[70] hidden items-center gap-3 bg-[#1c1c1e]/95 backdrop-blur-md border border-white/10 text-white px-4 py-3 rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.6)] max-w-[280px]">
  <div class="relative w-8 h-8 shrink-0 flex items-center justify-center">
    <svg class="w-8 h-8 -rotate-90" viewBox="0 0 36 36">
      <path class="text-white/10" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
      <path id="uploadProgressCircle" class="text-blue-500 transition-all duration-150" stroke-dasharray="0, 100" stroke-linecap="round" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
    </svg>
    <span id="uploadProgressPct" class="absolute text-[10px] font-bold">0%</span>
  </div>
  <div class="min-w-0 flex-1">
    <div id="uploadProgressTitle" class="text-[13px] font-medium truncate text-[#f2f2f7]">Đang tải lên Drive...</div>
    <div id="uploadProgressSub" class="text-[11px] sub truncate">Chạy ngầm</div>
  </div>
</div>

<div class="relative max-w-md mx-auto min-h-full bg-[#18181a] sm:my-6 sm:rounded-2xl sm:min-h-[calc(100%-3rem)] sm:shadow-[0_10px_40px_rgba(0,0,0,.5)] border border-white/5">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#18181a] sm:rounded-t-2xl border-b border-white/5" style="padding-top:env(safe-area-inset-top,0px)">
    <div class="h-16 px-5 grid grid-cols-[40px_1fr_40px] items-center">
      <button id="btnMenu" aria-label="Cài đặt" class="tap w-10 h-10 -ml-2 flex items-center justify-center text-[#8e8e93] hover:text-white">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M7 12h13M10 17h10"/></svg>
      </button>
      <div class="text-center leading-tight">
        <div class="text-[17px] font-medium text-[#f2f2f7] truncate max-w-[220px]">Chụp hình dạo cùng Culi AN</div>
        <div class="text-[12px] sub"><span id="doneNum">0</span> / <span id="totalNum">79</span> hoàn thành</div>
      </div>
      <button id="btnSearch" aria-label="Tìm kiếm" class="tap w-10 h-10 -mr-2 flex items-center justify-center text-[#8e8e93] hover:text-white justify-self-end">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>
    <div id="searchWrap" class="overflow-hidden transition-all duration-300" style="max-height:0">
      <div class="px-5 pb-3 relative">
        <input id="search" type="search" inputmode="numeric" placeholder="Tìm số villa" autocomplete="off" class="w-full h-10 px-4 pr-10 rounded-full soft text-[16px] text-white outline-none placeholder:text-[#636366]">
        <button id="clear" aria-label="Xoá" class="tap hidden absolute right-8 top-[calc(50%-6px)] -translate-y-1/2 w-[18px] h-[18px] rounded-full bg-[#48484a] text-white text-[11px] leading-none items-center justify-center">✕</button>
      </div>
    </div>
  </header>

  <!-- Segmented -->
  <div class="px-5 pt-4">
    <div class="relative flex p-[2px] rounded-full soft border border-white/5">
      <div id="segThumb" class="seg-t absolute top-[2px] bottom-[2px] left-[2px] w-[calc(50%-2px)] rounded-full bg-[#2c2c2e]" style="box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>
      <button data-tab="fav" class="seg relative z-10 flex-1 py-1.5 text-[14px] font-medium text-white">Nay làm... <span id="favCount" class="sub">0</span></button>
      <button data-tab="all" class="seg relative z-10 flex-1 py-1.5 text-[14px] font-medium text-white">Tất cả</button>
    </div>
  </div>

  <!-- List Chưa hoàn thành -->
  <div id="list" class="px-2 pt-2"></div>
  <p id="empty" class="hidden text-center text-[15px] sub py-20">Không có villa nào khớp.</p>

  <!-- Section Đã hoàn thành (Collapse / Thu gọn) -->
  <div id="completedSection" class="px-3 pt-4 pb-20 border-t border-white/5 mt-4 hidden">
    <button id="toggleCompleted" class="tap w-full flex items-center justify-between py-2 px-2 rounded-xl text-left">
      <div class="flex items-center gap-2">
        <span class="text-[15px] font-medium text-[#8e8e93]">Đã hoàn thành</span>
        <span id="completedBadge" class="text-[12px] font-medium px-2 py-0.5 rounded-full soft text-[#aeaeb2]">0</span>
      </div>
      <svg id="collapseIcon" class="w-4 h-4 text-[#8e8e93] transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>
    <div id="completedList" class="mt-1 hidden"></div>
  </div>
</div>

<input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
<div id="scrim" class="fade fixed inset-0 z-50 bg-black/60 opacity-0 pointer-events-none backdrop-blur-xs"></div>

<!-- Villa sheet -->
<div id="villaSheet" class="sheet fixed inset-x-0 bottom-0 z-[55] translate-y-full rounded-t-3xl bg-[#1c1c1e] text-white max-w-md mx-auto border-t border-white/10" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -8px 40px rgba(0,0,0,.5)">
  <div class="w-9 h-1 rounded-full bg-white/20 mx-auto mt-2.5 mb-4"></div>
  <div class="px-6 flex items-center justify-between">
    <div><div id="vsTitle" class="text-[22px] font-medium text-white">Villa 01</div><div id="vsSub" class="text-[13px] sub">Chưa có ảnh</div></div>
    <button id="vsStar" aria-label="Điểm danh" class="tap p-2 -mr-2"></button>
  </div>
  <div class="px-6 mt-4 grid grid-cols-2 gap-3">
    <button data-slot="before" class="slot tap aspect-[4/5] rounded-2xl bg-[#2c2c2e] overflow-hidden relative flex flex-col items-center justify-center text-[#8e8e93] border border-white/5"></button>
    <button data-slot="after" class="slot tap aspect-[4/5] rounded-2xl bg-[#2c2c2e] overflow-hidden relative flex flex-col items-center justify-center text-[#8e8e93] border border-white/5"></button>
  </div>
  <div class="px-6 mt-4"><button data-close class="tap w-full h-12 rounded-full bg-[#2c2c2e] text-[16px] font-medium text-white hover:bg-[#3a3a3c]">Xong</button></div>
</div>

<!-- Settings sheet -->
<div id="setSheet" class="sheet fixed inset-x-0 bottom-0 z-[55] translate-y-full rounded-t-3xl bg-[#1c1c1e] text-white max-w-md mx-auto border-t border-white/10" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -8px 40px rgba(0,0,0,.5)">
  <div class="w-9 h-1 rounded-full bg-white/20 mx-auto mt-2.5 mb-4"></div>
  <div class="px-6 pb-3"><div class="text-[22px] font-medium text-white">Kết nối Google Sheets</div>
  <div class="text-[13px] sub mt-0.5">Dán địa chỉ Web App (doPost) của Apps Script để gửi ảnh lên.</div></div>
  <div class="px-6"><input id="gasUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" class="w-full h-11 px-4 rounded-full bg-[#2c2c2e] text-white text-[15px] outline-none border border-white/5"></div>
  <div class="px-6 mt-4 grid grid-cols-2 gap-2">
    <button data-close class="tap h-12 rounded-full bg-[#2c2c2e] text-white text-[16px] font-medium">Đóng</button>
    <button id="gasSave" class="tap h-12 rounded-full bg-white text-black text-[16px] font-semibold">Lưu</button>
  </div>
</div>

<script>
// CẤU HÌNH MẶC ĐỊNH
const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbzSHV9lCQxvSNii1_5g3q_S0bvsWV7Z4TXMPLqgS2JJtKWxxY6cegy5MSaylHuoDStQqw/exec"; 

const TOTAL = 80;
// Bỏ qua villa 13 theo phong tục / quy hoạch (1..80 trừ 13)
const VILLAS_LIST = Array.from({length: TOTAL}, (_, i) => i + 1).filter(n => n !== 13);
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch(e){ return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
};

function getGasEndpoint() {
  return store.get('vi:gas', '') || DEFAULT_GAS_URL;
}
let favs = new Set(store.get('vi:favs', []));
let photos = store.get('vi:photos', {});
let tab = 'fav'; // Mặc định mở tab Điểm danh
let q = '', cur = null, slot = null;
let isCompletedExpanded = false;

const done = n => !!(photos[n] && photos[n].before && photos[n].after);
const started = n => !!(photos[n] && (photos[n].before || photos[n].after));
const sub = n => done(n) ? 'Đã chụp đủ ảnh trước và sau'
  : started(n) ? (photos[n].before ? 'Có ảnh trước, thiếu ảnh sau' : 'Có ảnh sau, thiếu ảnh trước')
  : 'Chưa kiểm tra';
const dot = n => done(n) ? '#34c759' : started(n) ? '#ff9f0a' : 'transparent';
const star = on => `<svg width="22" height="22" viewBox="0 0 24 24" fill="${on ? '#ffd60a' : 'none'}" stroke="${on ? '#ffd60a' : '#8e8e93'}" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;

function createRowElement(n) {
  const el = document.createElement('div');
  el.className = 'row flex items-center gap-4 px-3 h-24 rounded-2xl cursor-pointer';
  el.dataset.open = n;
  const p = photos[n] || {}, img = p.after || p.before;
  el.innerHTML = `
    <div class="relative shrink-0">
      <div class="w-[62px] h-[62px] rounded-full soft overflow-hidden flex items-center justify-center text-[20px] font-medium text-[#8e8e93] border border-white/5">${img ? `<img src="${img}" alt="" class="w-full h-full object-cover">` : pad(n)}</div>
      <span class="absolute right-0 bottom-0 w-[14px] h-[14px] rounded-full border-2 border-[#18181a]" style="background:${dot(n)}"></span>
    </div>
    <div class="flex-1 min-w-0">
      <div class="text-[18px] font-medium text-[#f2f2f7]">Villa ${pad(n)}</div>
      <div class="text-[14px] sub truncate">${sub(n)}</div>
    </div>
    <button data-star="${n}" aria-label="Điểm danh villa ${pad(n)}" class="tap p-2 -mr-1">${star(favs.has(n))}</button>`;
  return el;
}

function render(){
  const list = $('#list'); 
  const completedList = $('#completedList');
  const completedSection = $('#completedSection');
  
  list.innerHTML = ''; 
  completedList.innerHTML = '';
  
  let shownPending = 0;
  let shownCompleted = 0;

  for (const n of VILLAS_LIST){
    if (tab === 'fav' && !favs.has(n)) continue;
    if (q && !pad(n).includes(q) && !String(n).includes(q)) continue;

    const el = createRowElement(n);
    if (done(n)) {
      completedList.appendChild(el);
      shownCompleted++;
    } else {
      list.appendChild(el);
      shownPending++;
    }
  }

  if (shownCompleted > 0) {
    completedSection.classList.remove('hidden');
    $('#completedBadge').textContent = shownCompleted;
  } else {
    completedSection.classList.add('hidden');
  }

  let emptyMsg = 'Không có villa nào khớp.';
  if (tab === 'fav' && favs.size === 0 && !q) {
    emptyMsg = 'Chưa chọn căn nào vào mục "Nay làm...". Bấm sao ☆ ở tab Tất cả để thêm.';
  }
  $('#empty').textContent = emptyMsg;
  $('#empty').classList.toggle('hidden', (shownPending + shownCompleted) > 0);
  
  const d = VILLAS_LIST.filter(done).length;
  $('#doneNum').textContent = d; 
  $('#totalNum').textContent = VILLAS_LIST.length;
  // Đếm số lượng căn còn lại chưa làm trong tab Nay làm (chỉ tính căn chưa done)
  const pendingFavCount = [...favs].filter(n => !done(n)).length;
  $('#favCount').textContent = pendingFavCount;
}

$('#toggleCompleted').onclick = () => {
  isCompletedExpanded = !isCompletedExpanded;
  $('#completedList').classList.toggle('hidden', !isCompletedExpanded);
  $('#collapseIcon').style.transform = isCompletedExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
};

function renderSheet(){
  const p = photos[cur] || {};
  $('#vsTitle').textContent = 'Villa ' + pad(cur);
  $('#vsSub').textContent = sub(cur);
  $('#vsStar').innerHTML = star(favs.has(cur));
  document.querySelectorAll('.slot').forEach(b => {
    const k = b.dataset.slot, url = p[k], label = k === 'before' ? 'Ảnh trước' : 'Ảnh sau';
    b.innerHTML = url
      ? `<img src="${url}" alt="${label}" class="absolute inset-0 w-full h-full object-cover"><span class="absolute left-2 bottom-2 text-[12px] font-medium bg-black/80 text-white rounded-full px-2.5 py-1 backdrop-blur-xs">${label} · Chụp lại</span>`
      : `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="text-[14px] mt-2">${label}</span>`;
  });
}

let tt;
function toast(msg){
  $('#toastText').textContent = msg;
  const t = $('#toast'); t.classList.remove('-translate-y-24','opacity-0');
  clearTimeout(tt); tt = setTimeout(() => t.classList.add('-translate-y-24','opacity-0'), 2200);
}

const openSheet = id => { $('#scrim').classList.remove('opacity-0','pointer-events-none'); $(id).classList.remove('translate-y-full') };
function closeSheets(){ $('#scrim').classList.add('opacity-0','pointer-events-none'); document.querySelectorAll('.sheet').forEach(s => s.classList.add('translate-y-full')); render() }
function openVilla(n){ cur = n; renderSheet(); openSheet('#villaSheet') }
$('#scrim').onclick = closeSheets;
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);

function setTab(t){
  tab = t;
  $('#segThumb').style.transform = t === 'fav' ? 'translateX(0)' : 'translateX(100%)';
  document.querySelectorAll('.seg').forEach(b => b.style.opacity = b.dataset.tab === t ? 1 : .5);
  render();
}
document.querySelectorAll('.seg').forEach(b => b.onclick = () => setTab(b.dataset.tab));

$('#btnSearch').onclick = () => {
  const w = $('#searchWrap'), open = w.style.maxHeight !== '0px' && w.style.maxHeight !== '';
  w.style.maxHeight = open ? '0px' : '64px';
  if (!open) setTimeout(() => $('#search').focus(), 200);
};
$('#search').oninput = e => { q = e.target.value.trim(); $('#clear').classList.toggle('hidden', !q); $('#clear').classList.toggle('flex', !!q); render() };
$('#clear').onclick = () => { $('#search').value = ''; q = ''; $('#clear').classList.add('hidden'); $('#clear').classList.remove('flex'); render(); $('#search').focus() };

function toggleFav(n){ favs.has(n) ? favs.delete(n) : favs.add(n); store.set('vi:favs', [...favs]); toast(favs.has(n) ? `Đã điểm danh Villa ${pad(n)}` : `Đã bỏ điểm danh Villa ${pad(n)}`) }

function handleListClick(e) {
  const s = e.target.closest('[data-star]');
  if (s){ e.stopPropagation(); toggleFav(+s.dataset.star); render(); return }
  const r = e.target.closest('[data-open]');
  if (r) openVilla(+r.dataset.open);
}

$('#list').onclick = handleListClick;
$('#completedList').onclick = handleListClick;

$('#vsStar').onclick = () => { toggleFav(cur); renderSheet() };
document.querySelectorAll('.slot').forEach(b => b.onclick = () => { slot = b.dataset.slot; $('#cam').click() });

// Chuyển file ảnh trực tiếp sang Base64 giữ nguyên 100% chất lượng gốc (không nén, không resize)
function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Xử lý upload ngầm hiển thị % tiến trình bằng XMLHttpRequest
function uploadPhotoBackground(n, k, file, b64) {
  const gas = getGasEndpoint();
  if (!gas) return;

  const box = $('#uploadProgressBox');
  const circle = $('#uploadProgressCircle');
  const pctText = $('#uploadProgressPct');
  const title = $('#uploadProgressTitle');
  const subText = $('#uploadProgressSub');

  box.classList.remove('hidden');
  box.classList.add('flex');
  circle.setAttribute('stroke-dasharray', `0, 100`);
  pctText.textContent = '0%';
  title.textContent = `Villa ${pad(n)} (${k === 'before' ? 'Before' : 'After'})`;
  subText.textContent = `0% · Đang gửi ngầm...`;

  const payload = JSON.stringify({
    villaId: `Villa ${pad(n)}`,
    type: k,
    image: b64,
    mimeType: file.type || 'image/jpeg'
  });

  // Dùng fetch với mode: 'cors' và text/plain
  // Mô phỏng tiến trình upload mượt mà cho client
  let progress = 10;
  const interval = setInterval(() => {
    if (progress < 90) {
      progress += Math.floor(Math.random() * 15) + 5;
      if (progress > 90) progress = 90;
      circle.setAttribute('stroke-dasharray', `${progress}, 100`);
      pctText.textContent = `${progress}%`;
      subText.textContent = `${progress}% · Đang tải lên...`;
    }
  }, 200);

  fetch(gas, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: payload
  })
  .then(res => res.json())
  .then(result => {
    clearInterval(interval);
    circle.setAttribute('stroke-dasharray', `100, 100`);
    pctText.textContent = `100%`;
    if (result.status === 'success') {
      subText.textContent = `Hoàn tất lưu Drive ✓`;
      toast(`Villa ${pad(n)}: đã lưu ảnh lên Drive ✓`);
      if (result.fileUrl) {
        photos[n] = photos[n] || {};
        photos[n][k] = result.fileUrl;
        store.set('vi:photos', photos);
        renderSheet();
        render();
      }
    } else {
      subText.textContent = `Lỗi: ${result.message || 'Thất bại'}`;
      toast(`Lỗi Drive: ${result.message || 'Thất bại'}`);
    }
    setTimeout(() => {
      box.classList.add('hidden');
      box.classList.remove('flex');
    }, 2500);
  })
  .catch(err => {
    clearInterval(interval);
    console.error(err);
    subText.textContent = `Lỗi kết nối`;
    toast(`Lỗi gửi dữ liệu`);
    setTimeout(() => {
      box.classList.add('hidden');
      box.classList.remove('flex');
    }, 3000);
  });
}

$('#cam').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !cur || !slot) return;
  const n = cur, k = slot;
  
  try {
    const b64 = await readFileAsBase64(f);
    photos[n] = photos[n] || {};
    photos[n][k] = b64;
    store.set('vi:photos', photos);
    renderSheet();
    render();

    // Gửi ngầm lên Drive và hiển thị thanh % tiến trình
    uploadPhotoBackground(n, k, f, b64);
  } catch(err){
    console.error(err);
    toast(`Villa ${pad(n)}: lỗi đọc ảnh`);
  }
};

$('#btnMenu').onclick = () => { $('#gasUrl').value = store.get('vi:gas', ''); openSheet('#setSheet') };
$('#gasSave').onclick = () => { 
  store.set('vi:gas', $('#gasUrl').value.trim()); 
  closeSheets(); 
  toast('Đã lưu cài đặt');
};

setTab('fav');
</script>
</body>
</html>
