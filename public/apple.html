<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Villa Inspector — Apple Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #F2F2F7; /* Apple iOS System Gray 6 */
      color: #1C1C1E;
    }
    .glass {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.02);
    }
    .apple-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .apple-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen pb-28 select-none">

  <!-- iOS / macOS Top Bar (Dynamic Island / Navigation Bar Feel) -->
  <header class="sticky top-0 z-40 glass border-b border-black/[0.06] pt-2 pb-3 px-4">
    <div class="max-w-xl mx-auto space-y-3">
      <!-- Title & Action -->
      <div class="flex items-center justify-between">
        <div>
          <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Resort Housekeeping</span>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-1.5">
            Villa Inspector
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-blue-500/10 text-blue-600">
              Demo iOS
            </span>
          </h1>
        </div>
        <div class="flex items-center gap-2">
          <!-- Settings Icon -->
          <button onclick="openConfigModal()" class="w-9 h-9 rounded-full bg-slate-200/60 hover:bg-slate-200 active:scale-90 flex items-center justify-center transition-transform text-slate-700">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Segmented Control (Apple iOS Segment Picker) -->
      <div class="bg-black/[0.06] p-1 rounded-2xl flex items-center text-xs font-semibold text-slate-600">
        <button id="tab-all" onclick="setFilterMode('all')" class="flex-1 py-1.5 rounded-xl transition-all duration-200 bg-white text-slate-900 shadow-sm flex items-center justify-center gap-1.5">
          <span>Tất cả</span>
          <span id="all-count-pill" class="text-[10px] text-slate-400 font-normal">80</span>
        </button>
        <button id="tab-fav" onclick="setFilterMode('fav')" class="flex-1 py-1.5 rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-900 flex items-center justify-center gap-1.5">
          <span>⭐ Đã chọn</span>
          <span id="fav-count-pill" class="text-[10px] px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-700 hidden">0</span>
        </button>
      </div>

      <!-- iOS Search Field -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Tìm số Villa..." 
          class="w-full pl-9 pr-8 py-2 bg-black/[0.05] focus:bg-white border border-transparent focus:border-blue-500/30 rounded-xl text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none transition-all"
          oninput="handleSearch()"
        />
        <button 
          id="clear-search-btn" 
          onclick="clearSearch()" 
          class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 hidden"
        >
          <div class="w-4 h-4 rounded-full bg-slate-300 text-white flex items-center justify-center text-[10px] font-bold">✕</div>
        </button>
      </div>
    </div>
  </header>

  <!-- Progress Bar (iOS Health / Battery Widget Style) -->
  <div class="max-w-xl mx-auto px-4 pt-3">
    <div class="glass-card rounded-2xl p-3.5 border border-white/60 flex items-center justify-between">
      <div class="space-y-1">
        <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Tiến độ hôm nay</span>
        <div class="text-lg font-bold text-slate-900 tracking-tight flex items-baseline gap-1">
          <span id="progress-val">0</span>
          <span class="text-xs text-slate-400 font-normal">/ 80 hoàn thành</span>
        </div>
      </div>
      <div class="w-24 bg-slate-200/80 h-2 rounded-full overflow-hidden">
        <div id="progress-bar-fill" class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- Content Stream -->
  <main class="max-w-xl mx-auto px-4 pt-4 space-y-5">
    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" />

    <!-- Section: Đang dọn & Chưa hoàn thành -->
    <div>
      <div class="flex items-center justify-between px-1 mb-2">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Cần thực hiện (<span id="pending-count">80</span>)</h2>
      </div>
      <div id="pending-container" class="space-y-2.5 min-h-[60px]"></div>
    </div>

    <!-- Section: Đã hoàn thành (Collapsible) -->
    <div class="pt-2">
      <button id="toggle-completed-btn" class="w-full flex items-center justify-between py-2.5 px-3.5 glass-card rounded-2xl text-slate-700 font-semibold text-xs border border-white/60 apple-btn">
        <span class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          Đã hoàn thành (<span id="completed-count">0</span>)
        </span>
        <svg id="toggle-icon" class="w-4 h-4 text-slate-400 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>
      <div id="completed-container" class="space-y-2.5 mt-2.5 hidden"></div>
    </div>
  </main>

  <!-- iOS Image Preview / Action Sheet Modal -->
  <div id="preview-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white/95 backdrop-blur-2xl w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl space-y-4 border border-white/20 flex flex-col max-h-[85vh] p-4">
      <div class="flex justify-between items-center pb-2 border-b border-black/[0.06]">
        <div>
          <h3 id="modal-villa-title" class="font-bold text-base text-slate-900">Villa 01</h3>
          <p id="modal-photo-type" class="text-xs text-slate-500">Ảnh trước dọn</p>
        </div>
        <button onclick="closePreviewModal()" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800 text-xs font-bold">&times;</button>
      </div>
      
      <div class="flex-1 overflow-auto flex items-center justify-center bg-black/5 rounded-2xl p-2 min-h-[200px]">
        <img id="modal-image-preview" src="" alt="Preview" class="max-h-[50vh] w-auto object-contain rounded-xl shadow-md" />
      </div>

      <div class="space-y-2 pt-1">
        <button onclick="retakePhotoFromModal()" class="w-full py-3 px-4 bg-blue-600 active:bg-blue-700 text-white font-semibold rounded-2xl text-xs flex items-center justify-center gap-2 apple-btn shadow-sm shadow-blue-500/20">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          Chụp lại ảnh này
        </button>
        <button onclick="closePreviewModal()" class="w-full py-2.5 px-4 bg-slate-100 active:bg-slate-200 text-slate-700 font-semibold rounded-2xl text-xs apple-btn">
          Đóng
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Sheet Modal -->
  <div id="config-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white/95 backdrop-blur-xl w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl space-y-4 border border-white/40">
      <div class="flex justify-between items-center pb-2 border-b border-black/[0.06]">
        <h3 class="font-bold text-base text-slate-900">Thiết lập Google Apps Script</h3>
        <button onclick="closeConfigModal()" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold">&times;</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-medium text-slate-700 mb-1.5">Web App Endpoint URL (doPost):</label>
          <input type="url" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3.5 py-2.5 bg-slate-100 focus:bg-white border border-slate-200 focus:border-blue-500 rounded-xl font-mono text-xs focus:outline-none transition-colors" />
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeConfigModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-semibold text-xs apple-btn">Đóng</button>
        <button onclick="saveGasConfig()" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white font-semibold text-xs apple-btn shadow-sm shadow-blue-500/20">Lưu</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification (iOS Dynamic Island pill style) -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 glass px-4 py-2 rounded-full shadow-lg border border-black/[0.08] text-xs font-semibold text-slate-900 opacity-0 -translate-y-4 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
    <span id="toast-icon">✨</span>
    <span id="toast-msg">Thông báo</span>
  </div>

  <script>
    const TOTAL_VILLAS = 80;
    const VILLAS = Array.from({ length: TOTAL_VILLAS }, (_, i) => `Villa ${String(i + 1).padStart(2, '0')}`);

    let activeCapture = { villaId: null, type: null };
    let previewTarget = { villaId: null, type: null };
    let villaState = {};
    let favorites = new Set();
    let gasWebAppUrl = localStorage.getItem("gas_webapp_url") || "";
    let searchQuery = "";
    let filterMode = "all";

    function openConfigModal() {
      document.getElementById("gas-url-input").value = gasWebAppUrl;
      document.getElementById("config-modal").classList.remove("hidden");
    }
    function closeConfigModal() {
      document.getElementById("config-modal").classList.add("hidden");
    }
    function saveGasConfig() {
      const input = document.getElementById("gas-url-input").value.trim();
      gasWebAppUrl = input;
      localStorage.setItem("gas_webapp_url", input);
      closeConfigModal();
      showToast("Đã lưu thiết lập API", "✓");
    }

    function initState() {
      const savedState = localStorage.getItem("resort_villa_cleaning_state");
      if (savedState) {
        try { villaState = JSON.parse(savedState); } catch (e) { villaState = {}; }
      }
      VILLAS.forEach(id => {
        if (!villaState[id]) {
          villaState[id] = { beforeThumb: null, afterThumb: null, completed: false, lastActive: 0 };
        }
      });

      const savedFavs = localStorage.getItem("resort_villa_favorites");
      if (savedFavs) {
        try { favorites = new Set(JSON.parse(savedFavs)); } catch (e) { favorites = new Set(); }
      }
    }

    function saveState() {
      localStorage.setItem("resort_villa_cleaning_state", JSON.stringify(villaState));
      updateProgress();
    }

    function saveFavorites() {
      localStorage.setItem("resort_villa_favorites", JSON.stringify([...favorites]));
      updateProgress();
    }

    function toggleFavorite(id, e) {
      if (e) e.stopPropagation();
      if (favorites.has(id)) {
        favorites.delete(id);
      } else {
        favorites.add(id);
      }
      saveFavorites();
      renderAll();
    }

    function setFilterMode(mode) {
      filterMode = mode;
      const tabAll = document.getElementById("tab-all");
      const tabFav = document.getElementById("tab-fav");

      if (mode === "fav") {
        tabFav.className = "flex-1 py-1.5 rounded-xl transition-all duration-200 bg-white text-slate-900 shadow-sm flex items-center justify-center gap-1.5";
        tabAll.className = "flex-1 py-1.5 rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-900 flex items-center justify-center gap-1.5";
      } else {
        tabAll.className = "flex-1 py-1.5 rounded-xl transition-all duration-200 bg-white text-slate-900 shadow-sm flex items-center justify-center gap-1.5";
        tabFav.className = "flex-1 py-1.5 rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-900 flex items-center justify-center gap-1.5";
      }
      renderAll();
    }

    function showToast(msg, icon = "✨") {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").textContent = msg;
      document.getElementById("toast-icon").textContent = icon;
      toast.classList.remove("opacity-0", "-translate-y-4");
      toast.classList.add("opacity-100", "translate-y-0");
      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "-translate-y-4");
      }, 2500);
    }

    function updateProgress() {
      const completedCount = Object.values(villaState).filter(v => v.completed).length;
      document.getElementById("progress-val").textContent = completedCount;
      document.getElementById("completed-count").textContent = completedCount;
      document.getElementById("pending-count").textContent = TOTAL_VILLAS - completedCount;
      
      const pct = Math.round((completedCount / TOTAL_VILLAS) * 100);
      document.getElementById("progress-bar-fill").style.width = `${pct}%`;

      const favPill = document.getElementById("fav-count-pill");
      if (favorites.size > 0) {
        favPill.textContent = favorites.size;
        favPill.classList.remove("hidden");
      } else {
        favPill.classList.add("hidden");
      }
    }

    function handleSearch() {
      searchQuery = document.getElementById("search-input").value.trim().toLowerCase();
      const clearBtn = document.getElementById("clear-search-btn");
      if (searchQuery) {
        clearBtn.classList.remove("hidden");
      } else {
        clearBtn.classList.add("hidden");
      }
      renderAll();
    }

    function clearSearch() {
      document.getElementById("search-input").value = "";
      searchQuery = "";
      document.getElementById("clear-search-btn").classList.add("hidden");
      renderAll();
    }

    function openPreviewModal(villaId, type) {
      previewTarget = { villaId, type };
      const data = villaState[villaId];
      const imgSrc = type === "before" ? data.beforeThumb : data.afterThumb;
      if (!imgSrc) return;

      document.getElementById("modal-villa-title").textContent = villaId;
      document.getElementById("modal-photo-type").textContent = type === "before" ? "Ảnh trước khi dọn" : "Ảnh sau khi dọn";
      document.getElementById("modal-image-preview").src = imgSrc;
      document.getElementById("preview-modal").classList.remove("hidden");
    }

    function closePreviewModal() {
      document.getElementById("preview-modal").classList.add("hidden");
      previewTarget = { villaId: null, type: null };
    }

    function retakePhotoFromModal() {
      const { villaId, type } = previewTarget;
      closePreviewModal();
      if (villaId && type) {
        triggerCapture(villaId, type);
      }
    }

    function renderVillaCard(id) {
      const data = villaState[id];
      const isFav = favorites.has(id);
      const card = document.createElement("div");
      card.id = `card-${id.replace(/\s+/g, "_")}`;
      card.className = `glass-card p-3 rounded-2xl border ${isFav ? 'border-amber-300/80 bg-amber-500/[0.04]' : 'border-white/60'} flex flex-col sm:flex-row sm:items-center justify-between gap-3`;

      // Nút Trước
      let beforeBtnUI = "";
      if (data.beforeThumb) {
        beforeBtnUI = `
          <div class="flex items-center gap-1.5 bg-emerald-500/10 rounded-xl p-1 pr-2.5 border border-emerald-500/20">
            <button onclick="openPreviewModal('${id}', 'before')" class="apple-btn focus:outline-none">
              <img src="${data.beforeThumb}" class="w-8 h-8 object-cover rounded-lg shadow-xs" />
            </button>
            <div class="flex flex-col">
              <span class="text-[11px] font-bold text-emerald-700">Trước ✓</span>
              <button onclick="triggerCapture('${id}', 'before')" class="text-[10px] text-slate-400 hover:text-amber-600 text-left">Chụp lại</button>
            </div>
          </div>`;
      } else {
        beforeBtnUI = `
          <button onclick="triggerCapture('${id}', 'before')" id="btn-${id.replace(/\s+/g, "_")}-before" class="flex-1 py-2 px-3 bg-amber-500 active:bg-amber-600 text-white text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 apple-btn shadow-sm shadow-amber-500/20">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
            <span>Chụp Trước</span>
          </button>`;
      }

      // Nút Sau
      let afterBtnUI = "";
      if (data.afterThumb) {
        afterBtnUI = `
          <div class="flex items-center gap-1.5 bg-emerald-500/10 rounded-xl p-1 pr-2.5 border border-emerald-500/20">
            <button onclick="openPreviewModal('${id}', 'after')" class="apple-btn focus:outline-none">
              <img src="${data.afterThumb}" class="w-8 h-8 object-cover rounded-lg shadow-xs" />
            </button>
            <div class="flex flex-col">
              <span class="text-[11px] font-bold text-emerald-700">Sau ✓</span>
              <button onclick="triggerCapture('${id}', 'after')" class="text-[10px] text-slate-400 hover:text-amber-600 text-left">Chụp lại</button>
            </div>
          </div>`;
      } else {
        afterBtnUI = `
          <button onclick="triggerCapture('${id}', 'after')" id="btn-${id.replace(/\s+/g, "_")}-after" class="flex-1 py-2 px-3 bg-blue-600 active:bg-blue-700 text-white text-xs font-semibold rounded-xl flex items-center justify-center gap-1.5 apple-btn shadow-sm shadow-blue-500/20">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
            <span>Chụp Sau</span>
          </button>`;
      }

      card.innerHTML = `
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <button onclick="toggleFavorite('${id}', event)" class="p-1 -ml-1 text-slate-300 hover:text-amber-400 apple-btn">
              <span class="text-base leading-none">${isFav ? '⭐' : '☆'}</span>
            </button>
            <span class="font-bold text-slate-900 text-sm tracking-tight">${id}</span>
            ${data.completed ? '<span class="text-[10px] bg-emerald-500/15 text-emerald-700 font-bold px-2 py-0.5 rounded-full">Xong</span>' : ''}
            ${!data.completed && (data.beforeThumb || data.afterThumb) ? '<span class="text-[10px] bg-amber-500/15 text-amber-700 font-bold px-2 py-0.5 rounded-full">Đang dọn</span>' : ''}
          </div>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          ${beforeBtnUI}
          ${afterBtnUI}
        </div>
      `;
      return card;
    }

    function renderAll() {
      const pendingContainer = document.getElementById("pending-container");
      const completedContainer = document.getElementById("completed-container");
      pendingContainer.innerHTML = "";
      completedContainer.innerHTML = "";

      const filteredVillas = VILLAS.filter(id => {
        if (filterMode === "fav" && !favorites.has(id)) return false;
        if (!searchQuery) return true;
        const cleanId = id.toLowerCase().replace("villa", "").trim();
        const numOnly = searchQuery.replace("villa", "").trim();
        return id.toLowerCase().includes(searchQuery) || cleanId.startsWith(numOnly) || cleanId === numOnly;
      });

      const pendingList = filteredVillas.filter(id => !villaState[id].completed);
      pendingList.sort((a, b) => {
        if (filterMode === "all") {
          const aFav = favorites.has(a);
          const bFav = favorites.has(b);
          if (aFav && !bFav) return -1;
          if (!aFav && bFav) return 1;
        }

        const aInProgress = Boolean(villaState[a].beforeThumb || villaState[a].afterThumb);
        const bInProgress = Boolean(villaState[b].beforeThumb || villaState[b].afterThumb);
        if (aInProgress && !bInProgress) return -1;
        if (!aInProgress && bInProgress) return 1;

        const aTime = villaState[a].lastActive || 0;
        const bTime = villaState[b].lastActive || 0;
        if (aTime !== bTime) return bTime - aTime;

        return 0;
      });

      const completedList = filteredVillas.filter(id => villaState[id].completed);
      completedList.sort((a, b) => (villaState[b].lastActive || 0) - (villaState[a].lastActive || 0));

      pendingList.forEach(id => pendingContainer.appendChild(renderVillaCard(id)));
      completedList.forEach(id => completedContainer.appendChild(renderVillaCard(id)));

      if (pendingList.length === 0) {
        let emptyMsg = '🎉 Hoàn tất kiểm tra!';
        if (filterMode === "fav" && favorites.size === 0) {
          emptyMsg = 'Chưa chọn căn nào vào ⭐ Đã chọn';
        }
        pendingContainer.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">${emptyMsg}</div>`;
      }

      updateProgress();
    }

    function triggerCapture(villaId, type) {
      activeCapture = { villaId, type };
      const input = document.getElementById("camera-input");
      input.value = "";
      input.click();
    }

    function compressImage(file, maxWidth = 1280, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const base64 = canvas.toDataURL("image/jpeg", quality);
            resolve(base64);
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    document.getElementById("camera-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file || !activeCapture.villaId) return;

      const { villaId, type } = activeCapture;
      const btnId = `btn-${villaId.replace(/\s+/g, "_")}-${type}`;
      const btn = document.getElementById(btnId);

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="inline-block animate-spin border-2 border-white border-t-transparent rounded-full w-3 h-3 mr-1"></span> Đang gửi...`;
      }

      try {
        const compressedBase64 = await compressImage(file, 1280, 0.7);

        if (gasWebAppUrl) {
          const res = await fetch(gasWebAppUrl, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              villaId: villaId,
              type: type,
              image: compressedBase64,
              mimeType: "image/jpeg"
            })
          });

          const result = await res.json();
          if (result.status !== "success") {
            throw new Error(result.message || "Lỗi tải ảnh");
          }
        }

        if (type === "before") villaState[villaId].beforeThumb = compressedBase64;
        if (type === "after") villaState[villaId].afterThumb = compressedBase64;

        villaState[villaId].lastActive = Date.now();

        if (villaState[villaId].beforeThumb && villaState[villaId].afterThumb) {
          villaState[villaId].completed = true;
        }

        saveState();
        showToast(`Đã lưu ảnh ${type === "before" ? "Trước" : "Sau"} ${villaId}`, "📸");
        renderAll();
      } catch (err) {
        console.error(err);
        showToast("Lỗi: " + err.message, "⚠️");
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>Thử lại</span>`;
        }
      } finally {
        activeCapture = { villaId: null, type: null };
      }
    });

    const toggleBtn = document.getElementById("toggle-completed-btn");
    const completedContainer = document.getElementById("completed-container");
    const toggleIcon = document.getElementById("toggle-icon");
    toggleBtn.addEventListener("click", () => {
      const isHidden = completedContainer.classList.toggle("hidden");
      toggleIcon.style.transform = isHidden ? "rotate(0deg)" : "rotate(180deg)";
    });

    initState();
    renderAll();
  </script>
</body>
</html>
